# Deploys the CogniCoach accounts Worker (workers/accounts) to Cloudflare: sign-in + profile sync on
# free-plan SQLite Durable Objects. Runs on pushes to main that touch it, or by hand.
# Uses the same repository secrets as the motion Worker: CLOUDFLARE_API_TOKEN (required) and
# MOTION_DEV_CODE (optional, copied to this Worker as DEV_CODE).
name: Deploy cognicoach-accounts

on:
  push:
    branches: [main]
    paths:
      - "workers/accounts/**"
      - ".github/workflows/deploy-cognicoach-accounts.yml"
  workflow_dispatch:

concurrency:
  group: deploy-cognicoach-accounts
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/accounts
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 00ed78486159dbce2f059215aeee83e9
    steps:
      - name: Check for the Cloudflare token
        id: token
        working-directory: .
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else
            echo "::warning::CLOUDFLARE_API_TOKEN repository secret is not set - skipping the deploy"; echo "ok=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.token.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.token.outputs.ok == 'true'
        with:
          node-version: 22
      - name: Install
        if: steps.token.outputs.ok == 'true'
        run: npm ci
      - name: Deploy
        if: steps.token.outputs.ok == 'true'
        run: npx wrangler deploy
      - name: Copy the dev code to the Worker
        if: steps.token.outputs.ok == 'true'
        env:
          MOTION_DEV_CODE: ${{ secrets.MOTION_DEV_CODE }}
        run: |
          if [ -n "$MOTION_DEV_CODE" ]; then printf '%s' "$MOTION_DEV_CODE" | npx wrangler secret put DEV_CODE; fi
      - name: Health check
        if: steps.token.outputs.ok == 'true'
        run: curl -fsS --retry 6 --retry-delay 5 --retry-all-errors https://cognicoach-accounts.bodhishanbhag.workers.dev/health
