<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>CogniCoachVisualization(3D)</title>    
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  <style>
    #motion-controls {
      position: fixed;
      left: 16px;
      top: 16px;
      z-index: 20;
      width: 380px;
      max-width: calc(100vw - 32px);
      box-sizing: border-box;
      padding: 10px;
      font-family: Arial, sans-serif;
      color: #222;
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid #c8c8c8;
      border-radius: 6px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
      pointer-events: auto;
    }

    #motion-controls textarea {
      width: 100%;
      min-height: 120px;
      max-height: 220px;
      box-sizing: border-box;
      font-family: Consolas, Monaco, monospace;
      font-size: 13px;
      line-height: 1.35;
      padding: 8px;
      resize: vertical;
    }

    .motion-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin: 8px 0;
    }

    .motion-row:first-child {
      margin-top: 0;
    }

    .motion-row label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    #frame-slider {
      flex: 1 1 260px;
    }

    #motion-status {
      min-height: 20px;
      font-size: 13px;
      color: #444;
    }

    #drag-help {
      margin: 4px 0 8px;
      font-size: 12px;
      color: #555;
    }

    #motion-controls .ai-motion-row {
      align-items: end;
      padding-bottom: 8px;
      margin-bottom: 8px;
      border-bottom: 1px solid #ddd;
    }
    #motion-controls .motion-prompt-label {
      flex: 1 1 220px;
      min-width: 180px;
      align-items: stretch;
      flex-direction: column;
      gap: 4px;
    }
    #motion-prompt {
      width: 100%;
      min-width: 180px;
      box-sizing: border-box;
      padding: 7px;
    }
    #motion-duration { width: 76px; }
    #generate-motion-button {
      padding: 8px 10px;
      cursor: pointer;
      white-space: nowrap;
    }
    #generate-motion-button:disabled { cursor: wait; opacity: 0.65; }

    @media (max-width: 700px) {
      #motion-controls {
        left: 8px;
        right: 8px;
        top: 8px;
        width: auto;
      }
    }
  </style>
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">CogniCoachVisualization(3D)</div>
      </div>
    </div>
    <div id="motion-controls">
      <div class="motion-row ai-motion-row">
        <label class="motion-prompt-label">Movement prompt
          <input id="motion-prompt" type="text" value="Demonstrate a technically clear tennis forehand" placeholder="Describe a sports movement" />
        </label>
        <label>Duration (s) <input id="motion-duration" type="number" min="0.6" max="8" step="0.1" value="2.0" /></label>
        <button id="generate-motion-button" type="button">Generate AI Motion</button>
      </div>
      <div class="motion-row">
        <button id="load-frames-button" type="button">Load JSON Frames</button>
        <button id="play-motion-button" type="button">Play</button>
        <button id="prev-frame-button" type="button">Previous</button>
        <button id="next-frame-button" type="button">Next</button>
        <label>FPS <input id="fps-input" type="number" min="1" max="60" value="8"></label>
        <label>Frame <input id="frame-number-input" type="number" min="1" value="1"></label>
      </div>
      <div class="motion-row">
        <input id="frame-slider" type="range" min="0" max="0" value="0">
        <span id="frame-count-label">1 / 1</span>
      </div>
      <div id="drag-help">Use Up/Down arrows for positionx and Left/Right arrows for positiony.</div>
      <textarea id="bodycode-frames-input" spellcheck="false"></textarea>
      <div id="motion-status">Unity is loading. Start motion_engine.py, then use Generate AI Motion.</div>
    </div>
    <script>
      
      var canvas = document.querySelector("#unity-canvas");
      var motionControls = document.querySelector("#motion-controls");
      var unityMotionInstance = null;
      var diagnosticLogEntries = [];
      var diagnosticLogLimit = 10;
      var lastUnityProgressLog = -1;
      var motionAnimationId = null;
      var motionFrameStartedAt = 0;
      var currentFrameIndex = 0;
      var bodyPosition = {
        "positionx": 0,
        "positiony": 0,
        "positionz": 0
      };

      function diagnosticValue(value) {
        if (value instanceof Error) {
          return value.name + ": " + value.message + (value.stack ? "\n" + value.stack : "");
        }
        if (typeof value === "string") {
          return value;
        }
        try {
          return JSON.stringify(value, function(key, nestedValue) {
            if (typeof nestedValue === "bigint") {
              return nestedValue.toString() + "n";
            }
            if (nestedValue instanceof Error) {
              return nestedValue.name + ": " + nestedValue.message;
            }
            return nestedValue;
          });
        } catch (error) {
          return String(value);
        }
      }

      function appendDiagnosticLog(source, values) {
        var entry = new Date().toISOString() + " [" + source + "] " +
          Array.prototype.map.call(values, diagnosticValue).join(" ");
        diagnosticLogEntries.push(entry);
        if (diagnosticLogEntries.length > diagnosticLogLimit) {
          diagnosticLogEntries.shift();
        }
      }

      function installDiagnosticConsoleBridge() {
        if (window.diagnosticConsoleBridgeInstalled) {
          return;
        }

        window.diagnosticConsoleBridgeInstalled = true;
        window.addEventListener("error", function(event) {
          appendDiagnosticLog("JS uncaught error", [
            event.message,
            event.filename + ":" + event.lineno + ":" + event.colno,
            event.error || ""
          ]);
        });
        window.addEventListener("unhandledrejection", function(event) {
          appendDiagnosticLog("JS unhandled rejection", [event.reason]);
        });

        // Unity WebGL plugins can call either name to send a message back here.
        window.logFromUnity = function(message) {
          appendDiagnosticLog("Unity -> JS", arguments);
        };
        window.receiveUnityLog = window.logFromUnity;
      }

      function sendUnityMessage(objectName, methodName, value) {
        if (!unityMotionInstance) {
          appendDiagnosticLog("JS -> Unity", ["Skipped; Unity instance is not ready"]);
          return false;
        }
        try {
          unityMotionInstance.SendMessage(objectName, methodName, value);
          return true;
        } catch (error) {
          appendDiagnosticLog("JS -> Unity error", [objectName, methodName, error]);
          throw error;
        }
      }

      installDiagnosticConsoleBridge();

      function isMotionControlFocused() {
        return !!(document.activeElement && motionControls && motionControls.contains(document.activeElement));
      }

      function installHtmlInputKeyboardGuard() {
        if (window.htmlInputKeyboardGuardInstalled) {
          return;
        }

        window.htmlInputKeyboardGuardInstalled = true;
        var originalAddEventListener = EventTarget.prototype.addEventListener;

        EventTarget.prototype.addEventListener = function(type, listener, options) {
          var isKeyboardEvent =
            type === "keydown" ||
            type === "keypress" ||
            type === "keyup";
          var isUnityKeyboardTarget =
            this === window ||
            this === document ||
            this === document.body ||
            this === canvas;

          if (isKeyboardEvent && isUnityKeyboardTarget && typeof listener === "function") {
            var guardedListener = function(event) {
              if (isMotionControlFocused()) {
                return;
              }

              return listener.call(this, event);
            };

            return originalAddEventListener.call(this, type, guardedListener, options);
          }

          return originalAddEventListener.call(this, type, listener, options);
        };
      }

      installHtmlInputKeyboardGuard();

      var DEFAULT_BODY_CODE = {
        "hipx": 0,
        "hipy": 0,
        "hipz": 0,
        "lefthipx": 0,
        "lefthipy": 0,
        "lefthipz": 0,
        "righthipx": 0,
        "righthipy": 0,
        "righthipz": 0,
        "leftkneex": 0,
        "leftkneey": 0,
        "leftkneez": 0,
        "rightkneex": 0,
        "rightkneey": 0,
        "rightkneez": 0,
        "spinex": 0,
        "spiney": 0,
        "spinez": 0,
        "neckx": 0,
        "necky": 0,
        "neckz": 0,
        "leftshoulderx": 0,
        "leftshouldery": 0,
        "leftshoulderz": 0,
        "rightshoulderx": 0,
        "rightshouldery": 0,
        "rightshoulderz": 0,
        "leftelbowx": 0,
        "leftelbowy": 0,
        "leftelbowz": 0,
        "rightelbowx": 0,
        "rightelbowy": 0,
        "rightelbowz": 0,
        "positionx": 0,
        "positiony": 0,
        "positionz": 0
      };

      var motionFrames = [{"rightshoulderx": 15, "leftshoulderx": -15, "spiney": 15, "lefthipx": 30, "leftkneex": -30}, {"rightshoulderx": 20, "leftshoulderx": -20, "spiney": 20, "rightelbowx": 5, "lefthipx": 15, "positionx": -5, "righthipx": -15}, {"leftshoulderx": 15, "rightshoulderx": -15, "spiney": -15, "righthipx": 30, "rightkneex": -30}, {"leftshoulderx": 20, "rightshoulderx": -20, "spiney": -20, "leftelbowx": 5, "righthipx": 15, "positionx": -5, "lefthipx": -15}];
      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function multiplyQuaternions(parent, local) {
        var x = parent.w * local.x + parent.x * local.w + parent.y * local.z - parent.z * local.y;
        var y = parent.w * local.y - parent.x * local.z + parent.y * local.w + parent.z * local.x;
        var z = parent.w * local.z + parent.x * local.y - parent.y * local.x + parent.z * local.w;
        var w = parent.w * local.w - parent.x * local.x - parent.y * local.y - parent.z * local.z;
        var magnitude = Math.sqrt(x * x + y * y + z * z + w * w);
        return { x: x / magnitude, y: y / magnitude, z: z / magnitude, w: w / magnitude };
      }

      function eulerToQuaternion(xDegrees, yDegrees, zDegrees) {
        var halfRadians = Math.PI / 360;
        var x = xDegrees * halfRadians;
        var y = yDegrees * halfRadians;
        var z = zDegrees * halfRadians;
        var qx = { x: Math.sin(x), y: 0, z: 0, w: Math.cos(x) };
        var qy = { x: 0, y: Math.sin(y), z: 0, w: Math.cos(y) };
        var qz = { x: 0, y: 0, z: Math.sin(z), w: Math.cos(z) };

        // Unity applies Euler rotations in Z-X-Y order.
        return multiplyQuaternions(multiplyQuaternions(qy, qx), qz);
      }

      function quaternionToEuler(quaternion) {
        var x = quaternion.x;
        var y = quaternion.y;
        var z = quaternion.z;
        var w = quaternion.w;
        var m00 = 1 - 2 * (y * y + z * z);
        var m02 = 2 * (x * z + y * w);
        var m10 = 2 * (x * y + z * w);
        var m11 = 1 - 2 * (x * x + z * z);
        var m12 = 2 * (y * z - x * w);
        var m20 = 2 * (x * z - y * w);
        var m22 = 1 - 2 * (x * x + y * y);
        var xAngle = Math.asin(Math.max(-1, Math.min(1, -m12)));
        var yAngle;
        var zAngle;

        if (Math.abs(Math.cos(xAngle)) > 1e-6) {
          yAngle = Math.atan2(m02, m22);
          zAngle = Math.atan2(m10, m11);
        } else {
          yAngle = Math.atan2(-m20, m00);
          zAngle = 0;
        }

        var toDegrees = 180 / Math.PI;
        return [
          xAngle * toDegrees,
          yAngle * toDegrees,
          zAngle * toDegrees
        ];
      }

      function composeJointRotation(json, joint, parentRotation) {
        var localRotation = eulerToQuaternion(
          Number(json[joint + "x"]) || 0,
          Number(json[joint + "y"]) || 0,
          Number(json[joint + "z"]) || 0
        );
        var worldRotation = multiplyQuaternions(parentRotation, localRotation);
        var worldAngles = quaternionToEuler(worldRotation);
        json[joint + "x"] = worldAngles[0];
        json[joint + "y"] = worldAngles[1];
        json[joint + "z"] = worldAngles[2];
        return worldRotation;
      }

      function relativityCalculation(json){
        var bodyRotation = eulerToQuaternion(json.positionx, json.positiony, json.positionz);
        var hipRotation = composeJointRotation(json, "hip", bodyRotation);
        var spineRotation = composeJointRotation(json, "spine", bodyRotation);
        var leftHipRotation = composeJointRotation(json, "lefthip", hipRotation);
        var rightHipRotation = composeJointRotation(json, "righthip", hipRotation);
        composeJointRotation(json, "leftknee", leftHipRotation);
        composeJointRotation(json, "rightknee", rightHipRotation);
        var leftShoulderRotation = composeJointRotation(json, "leftshoulder", spineRotation);
        var rightShoulderRotation = composeJointRotation(json, "rightshoulder", spineRotation);
        composeJointRotation(json, "leftelbow", leftShoulderRotation);
        composeJointRotation(json, "rightelbow", rightShoulderRotation);
        composeJointRotation(json, "neck", spineRotation);
        return JSON.stringify(json)
      }

      function cloneBodyCode(frame) {
        var frameBody = Object.assign({}, DEFAULT_BODY_CODE, frame || {});
        frameBody.positionx = (Number(frameBody.positionx) || 0) + bodyPosition.positionx;
        frameBody.positiony = (Number(frameBody.positiony) || 0) + bodyPosition.positiony;
        frameBody.positionz = (Number(frameBody.positionz) || 0) + bodyPosition.positionz;
        return frameBody;
      }

      function interpolateAngleDegrees(fromValue, toValue, amount) {
        var difference = ((toValue - fromValue + 540) % 360) - 180;
        return fromValue + difference * amount;
      }

      function shouldWrapAngle(key) {
        return key !== "positionx" && key !== "positiony" && key !== "positionz";
      }

      function interpolateBodyCode(fromFrame, toFrame, amount) {
        var fromBody = cloneBodyCode(fromFrame);
        var toBody = cloneBodyCode(toFrame);
        var blendedBody = {};

        Object.keys(DEFAULT_BODY_CODE).forEach(function(key) {
          var fromValue = Number(fromBody[key]) || 0;
          var toValue = Number(toBody[key]) || 0;
          blendedBody[key] = shouldWrapAngle(key)
            ? interpolateAngleDegrees(fromValue, toValue, amount)
            : fromValue + (toValue - fromValue) * amount;
        });

        return blendedBody;
      }

      function getFrameInputElements() {
        return {
          textarea: document.querySelector("#bodycode-frames-input"),
          loadButton: document.querySelector("#load-frames-button"),
          playButton: document.querySelector("#play-motion-button"),
          prevButton: document.querySelector("#prev-frame-button"),
          nextButton: document.querySelector("#next-frame-button"),
          fpsInput: document.querySelector("#fps-input"),
          numberInput: document.querySelector("#frame-number-input"),
          slider: document.querySelector("#frame-slider"),
          countLabel: document.querySelector("#frame-count-label"),
          status: document.querySelector("#motion-status"),
          generateButton: document.querySelector("#generate-motion-button"),
          promptInput: document.querySelector("#motion-prompt"),
          durationInput: document.querySelector("#motion-duration")
        };
      }

      function setMotionStatus(message, isError) {
        var controls = getFrameInputElements();
        controls.status.textContent = message;
        controls.status.style.color = isError ? "#a40000" : "#444";
        appendDiagnosticLog("Motion status", [message, isError ? "error" : "info"]);
      }

      function updateFrameControls() {
        var controls = getFrameInputElements();
        var totalFrames = motionFrames.length;
        controls.slider.max = Math.max(0, totalFrames - 1);
        controls.slider.value = currentFrameIndex;
        controls.numberInput.max = totalFrames;
        controls.numberInput.value = currentFrameIndex + 1;
        controls.countLabel.textContent = (currentFrameIndex + 1) + " / " + totalFrames;
      }

      function sendCurrentFrame() {
        if (!unityMotionInstance || !motionFrames.length) {
          return;
        }

        var frame = cloneBodyCode(motionFrames[currentFrameIndex]);
        sendUnityMessage("WebBridge", "UpdateMotion", relativityCalculation(frame));
        updateFrameControls();
        setMotionStatus("Showing frame " + (currentFrameIndex + 1) + " of " + motionFrames.length + ".");
      }

      function sendInterpolatedFrame(amount) {
        if (!unityMotionInstance || !motionFrames.length) {
          return;
        }

        var nextFrameIndex = (currentFrameIndex + 1) % motionFrames.length;
        var frame = interpolateBodyCode(
          motionFrames[currentFrameIndex],
          motionFrames[nextFrameIndex],
          amount
        );
        sendUnityMessage("WebBridge", "UpdateMotion", relativityCalculation(frame));
        updateFrameControls();
      }

      function getPlaybackBlendAmount(now, fps) {
        var frameDuration = 1000 / fps;
        var elapsed = now - motionFrameStartedAt;

        while (elapsed >= frameDuration) {
          currentFrameIndex = (currentFrameIndex + 1) % motionFrames.length;
          motionFrameStartedAt += frameDuration;
          elapsed = now - motionFrameStartedAt;
        }

        return Math.max(0, Math.min(1, elapsed / frameDuration));
      }

      function resendCurrentPose() {
        if (motionAnimationId) {
          var controls = getFrameInputElements();
          var fps = Math.max(1, Math.min(60, Number(controls.fpsInput.value) || 8));
          sendInterpolatedFrame(getPlaybackBlendAmount(performance.now(), fps));
        } else {
          sendCurrentFrame();
        }
      }

      function syncFramesTextarea() {
        var controls = getFrameInputElements();
        controls.textarea.value = JSON.stringify(motionFrames, null, 2);
      }

      function formatBodyPosition() {
        return "position: x " + bodyPosition.positionx.toFixed(2) +
          ", y " + bodyPosition.positiony.toFixed(2) +
          ", z " + bodyPosition.positionz.toFixed(2) + ".";
      }

      function showFrame(index) {
        currentFrameIndex = Math.max(0, Math.min(motionFrames.length - 1, index));
        sendCurrentFrame();
      }

      function stopMotionLoop() {
        var controls = getFrameInputElements();
        if (motionAnimationId) {
          cancelAnimationFrame(motionAnimationId);
          motionAnimationId = null;
        }
        controls.playButton.textContent = "Play";
      }

      function startMotionLoop() {
        var controls = getFrameInputElements();
        var fps = Math.max(1, Math.min(60, Number(controls.fpsInput.value) || 8));
        stopMotionLoop();
        controls.fpsInput.value = fps;
        controls.playButton.textContent = "Pause";
        motionFrameStartedAt = performance.now();

        function animateMotion(now) {
          sendInterpolatedFrame(getPlaybackBlendAmount(now, fps));
          setMotionStatus(
            "Playing frame " + (currentFrameIndex + 1) +
            " toward frame " + (((currentFrameIndex + 1) % motionFrames.length) + 1) + "."
          );
          motionAnimationId = requestAnimationFrame(animateMotion);
        }

        motionAnimationId = requestAnimationFrame(animateMotion);
      }

      function parseMotionFrames() {
        var controls = getFrameInputElements();
        var parsed = JSON.parse(controls.textarea.value);
        if (!Array.isArray(parsed) || parsed.length === 0) {
          throw new Error("The bodycode input must be a non-empty JSON array of frame objects.");
        }
        parsed.forEach(function(frame, index) {
          if (!frame || Array.isArray(frame) || typeof frame !== "object") {
            throw new Error("Frame " + (index + 1) + " must be a JSON object.");
          }
        });
        return parsed;
      }

      function setupMotionControls() {
        var controls = getFrameInputElements();
        if (!controls.textarea.value.trim()) {
          controls.textarea.value = JSON.stringify(motionFrames, null, 2);
        }
        updateFrameControls();

        controls.loadButton.onclick = function() {
          try {
            motionFrames = parseMotionFrames();
            currentFrameIndex = 0;
            stopMotionLoop();
            syncFramesTextarea();
            sendCurrentFrame();
            setMotionStatus("Loaded " + motionFrames.length + " animation frames.");
          } catch (error) {
            setMotionStatus(error.message, true);
          }
        };

        controls.playButton.onclick = function() {
          if (motionAnimationId) {
            stopMotionLoop();
            sendCurrentFrame();
          } else {
            startMotionLoop();
          }
        };

        controls.prevButton.onclick = function() {
          stopMotionLoop();
          showFrame(currentFrameIndex - 1);
        };

        controls.nextButton.onclick = function() {
          stopMotionLoop();
          showFrame(currentFrameIndex + 1);
        };

        controls.slider.oninput = function() {
          stopMotionLoop();
          showFrame(Number(controls.slider.value));
        };

        controls.numberInput.onchange = function() {
          stopMotionLoop();
          showFrame((Number(controls.numberInput.value) || 1) - 1);
        };

        controls.fpsInput.onchange = function() {
          if (motionAnimationId) {
            startMotionLoop();
          }
        };

        // The OpenAI API key stays on the Python backend, not in this browser file.
        if (controls.generateButton) {
          controls.generateButton.onclick = async function() {
            var movement = (controls.promptInput && controls.promptInput.value || "").trim();
            var duration = Number(controls.durationInput && controls.durationInput.value) || 2.0;
            var fps = Math.max(6, Math.min(30, Number(controls.fpsInput.value) || 12));
            if (movement.length < 3) {
              setMotionStatus("Enter a sports movement first.", true);
              return;
            }

            controls.generateButton.disabled = true;
            controls.generateButton.textContent = "Generating...";
            setMotionStatus("Planning motion, solving joints, and checking the result...");
            try {
              var response = await fetch("http://127.0.0.1:8000/generate", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  movement: movement,
                  duration_seconds: duration,
                  playback_fps: fps,
                  dominant_side: "right",
                  extra_instructions: "Make the movement useful as a clear visual demonstration for a sports coaching app.",
                  repair_attempts: 2
                })
              });
              var payload = await response.json();
              if (!response.ok) {
                throw new Error(payload.detail || ("Motion service returned HTTP " + response.status));
              }
              if (!Array.isArray(payload.frames) || payload.frames.length < 2) {
                throw new Error("The motion service returned no usable frames.");
              }

              stopMotionLoop();
              motionFrames = payload.frames;
              currentFrameIndex = 0;
              controls.fpsInput.value = payload.playback_fps || fps;
              syncFramesTextarea();
              updateFrameControls();
              sendCurrentFrame();

              var report = payload.report || {};
              var status = "Generated " + motionFrames.length + " frames.";
              status += report.passed_geometric_checks ? " Nominal-rig geometry checks passed." : " Nominal-rig checks found " + (report.failure_count || 0) + " issue(s).";
              if (report.max_anchor_error_m) {
                var errs = report.max_anchor_error_m;
                var largest = Math.max(errs.left_hand || 0, errs.right_hand || 0, errs.left_foot || 0, errs.right_foot || 0);
                status += " Max model anchor error: " + largest.toFixed(3) + " m.";
              }
              if (report.warnings && report.warnings.length) { status += " " + report.warnings[0]; }
              setMotionStatus(status, false);
              console.log("Motion plan:", payload.plan);
              console.log("Motion verification:", report);
            } catch (error) {
              setMotionStatus("Generation failed: " + error.message + " Make sure motion_engine.py is running.", true);
              console.error(error);
            } finally {
              controls.generateButton.disabled = false;
              controls.generateButton.textContent = "Generate AI Motion";
            }
          };
        }

      }

      setupMotionControls();

      function keepControlsInteractive() {
        if (typeof WebGLInput !== "undefined") {
          WebGLInput.captureAllKeyboardInput = false;
        }

        if (motionControls.dataset.controlsInteractive === "true") {
          return;
        }

        motionControls.dataset.controlsInteractive = "true";

        ["pointerdown", "mousedown", "mouseup", "click", "dblclick", "keydown", "keyup", "keypress"].forEach(function(eventName) {
          motionControls.addEventListener(eventName, function(event) {
            event.stopPropagation();
          });
        });
      }

      keepControlsInteractive();

      function setupPositionArrowKeys() {
        var positionStep = 1;

        window.addEventListener("keydown", function(event) {
          var activeTag = document.activeElement && document.activeElement.tagName;
          if (activeTag === "TEXTAREA" || activeTag === "INPUT") {
            return;
          }

          if (
            event.key !== "ArrowUp" &&
            event.key !== "ArrowDown" &&
            event.key !== "ArrowLeft" &&
            event.key !== "ArrowRight"
          ) {
            return;
          }

          if (event.key === "ArrowUp" || event.key === "ArrowDown") {
            var xDirection = event.key === "ArrowUp" ? 1 : -1;
            bodyPosition.positionx += xDirection * positionStep;
          } else {
            var yDirection = event.key === "ArrowRight" ? 1 : -1;
            bodyPosition.positiony += yDirection * positionStep;
          }

          resendCurrentPose();
          setMotionStatus("Global " + formatBodyPosition());
          event.preventDefault();
        });
      }

      setupPositionArrowKeys();
      function unityShowBanner(msg, type) {
        appendDiagnosticLog("Unity banner", [type || "info", msg]);
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/Builds.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/Builds.data.unityweb",
        frameworkUrl: buildUrl + "/Builds.framework.js.unityweb",
        codeUrl: buildUrl + "/Builds.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "CogniCoachVisualization(3D)",
        productVersion: "0.1.0",
        showBanner: unityShowBanner,
        print: function(message) {
          appendDiagnosticLog("Unity print", arguments);
        },
        printErr: function(message) {
          appendDiagnosticLog("Unity error", arguments);
        },
        // errorHandler: function(err, url, line) {
        //    alert("error " + err + " occurred at line " + line);
        //    // Return 'true' if you handled this error and don't want Unity
        //    // to process it further, 'false' otherwise.
        //    return true;
        // },
      };

      // By default, Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      // If you would like all file writes inside Unity Application.persistentDataPath
      // directory to automatically persist so that the contents are remembered when
      // the user revisits the site the next time, uncomment the following line:
      // config.autoSyncPersistentDataPath = true;
      // This autosyncing is currently not the default behavior to avoid regressing
      // existing user projects that might rely on the earlier manual
      // JS_FileSystem_Sync() behavior, but in future Unity version, this will be
      // expected to change.

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:

        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";

        // To lower canvas resolution on mobile devices to gain some
        // performance, uncomment the following line:
        // config.devicePixelRatio = 1;


      } else {
        // Desktop style: Render the game canvas in a window that can be maximized to fullscreen:
        canvas.style.width = "960px";
        canvas.style.height = "600px";
      }

      document.querySelector("#unity-loading-bar").style.display = "block";
      appendDiagnosticLog("JS", ["Loading Unity", {
        loaderUrl: loaderUrl,
        dataUrl: config.dataUrl,
        frameworkUrl: config.frameworkUrl,
        codeUrl: config.codeUrl,
        userAgent: navigator.userAgent
      }]);

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        appendDiagnosticLog("JS", ["Unity loader script loaded"]);
        createUnityInstance(canvas, config, (progress) => {
            
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
          if (progress === 1 || progress - lastUnityProgressLog >= 0.1) {
            lastUnityProgressLog = progress;
            appendDiagnosticLog("Unity load progress", [Math.round(progress * 100) + "%"]);
          }
              }).then((unityInstance) => {
                appendDiagnosticLog("Unity -> JS", ["Unity instance initialized"]);
                document.querySelector("#unity-loading-bar").style.display = "none";
                document.querySelector("#unity-fullscreen-button").onclick = () => {
                  unityInstance.SetFullscreen(1);
                };
                unityMotionInstance = unityInstance;
                keepControlsInteractive();
                setupMotionControls();
                setMotionStatus("Unity loaded. Default walking animation is running.");
                // Unloading web content from DOM so that browser GC can run can be tricky to get right.
                // This code snippet shows how to correctly implement a Unity content Unload mechanism to a web page.

                // Unloading Unity content enables a web page to reclaim the memory used by Unity, e.g. for
                // the purpose of later loading another Unity content instance on the _same_ web page.

                // When using this functionality, take caution to carefully make sure to clear all JavaScript code,
                // DOM element and event handler references to the old content you may have retained, or
                // otherwise the browser's garbage collector will be unable to reclaim the old page.

                // N.b. Unity content does _not_ need to be manually unloaded when the user is navigating away from
                // the current page to another web page. The browser will take care to clear memory of old visited
                // pages automatically. This functionality is only needed if you want to switch between loading
                // multiple Unity builds on a single web page.
                var quit = document.createElement("button");
                quit.style = "margin-left: 5px; background-color: lightgray; border: none; padding: 5px; cursor: pointer";
                quit.innerHTML = "Unload";
                document.querySelector("#unity-build-title").appendChild(quit);
                quit.onclick = () => {
                  // Quit Unity application execution
                  stopMotionLoop();
                  unityInstance.Quit().then(() => {
                    // Remove DOM elements from the page so GC can run
                    document.querySelector("#unity-container").remove();
                    canvas = null;
                    // Remover script elements from the page so GC can run
                    script.remove();
                    script = null;
                  });
                };
              }).catch((message) => {
                appendDiagnosticLog("Unity initialization error", [message]);
                alert(message);
              });
            };

      script.onerror = function(error) {
        appendDiagnosticLog("JS loader error", [loaderUrl, error]);
        setMotionStatus("Unity loader failed. See Diagnostic Log.", true);
      };
      document.body.appendChild(script);
     
    </script>
  </body>
</html>
